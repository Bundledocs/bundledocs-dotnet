name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test (integration)
        if: env.BUNDLEDOCS_ACCESS_TOKEN != ''
        run: dotnet test --no-build --configuration Release --verbosity normal
        env:
          BUNDLEDOCS_ACCESS_TOKEN: ${{ secrets.BUNDLEDOCS_ACCESS_TOKEN }}
          BUNDLEDOCS_API_URL: ${{ secrets.BUNDLEDOCS_API_URL }}
