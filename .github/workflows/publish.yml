name: Publish NuGet Package

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  publish:
    name: Pack & Publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Pack
        run: dotnet pack Bundledocs.Api.Wrapper/Bundledocs.Api.Wrapper.csproj --no-build --configuration Release --output nuget

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        continue-on-error: true
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        if: steps.login.outcome == 'success'
        run: dotnet nuget push nuget/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source "https://api.nuget.org/v3/index.json" --skip-duplicate

      - name: Publish to GitHub Packages
        run: dotnet nuget push nuget/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source "https://nuget.pkg.github.com/Bundledocs/index.json" --skip-duplicate
